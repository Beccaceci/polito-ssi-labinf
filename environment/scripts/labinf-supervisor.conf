[unix_http_server]
file=/run/labinf-supervisor.sock
chmod=0700
[supervisord]
nodaemon=true
logfile=/var/log/labinf/supervisor.log
pidfile=/run/labinf-supervisor.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/labinf-supervisor.sock
[program:apache]
command=/usr/local/bin/labinf-apache
autostart=%(ENV_LABINF_START_APACHE)s
autorestart=unexpected
stdout_logfile=/var/log/labinf/apache.log
stderr_logfile=/var/log/labinf/apache-error.log
[program:ssh]
command=/usr/sbin/sshd -D -e
autostart=%(ENV_LABINF_START_SSH)s
autorestart=unexpected
stdout_logfile=/var/log/labinf/ssh.log
stderr_logfile=/var/log/labinf/ssh-error.log
[program:ipsec]
command=/usr/sbin/ipsec start --nofork
autostart=false
autorestart=unexpected
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/labinf/ipsec.log
stderr_logfile=/var/log/labinf/ipsec-error.log
[program:dns]
command=/usr/sbin/dnsmasq --keep-in-foreground --conf-file=/etc/dnsmasq.d/labinf.conf
autostart=%(ENV_LABINF_START_DNS)s
autorestart=unexpected
stdout_logfile=/var/log/labinf/dns.log
stderr_logfile=/var/log/labinf/dns-error.log
