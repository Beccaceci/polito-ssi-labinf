# Rootful Docker is required for real Netfilter/XFRM; rootless is not equivalent.
base:
 - template:docker-rootful
vmType: vz
cpus: 4
memory: 4GiB
disk: 40GiB
images:
 - location: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-arm64.img
   arch: aarch64
   digest: sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e
 - location: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-amd64.img
   arch: x86_64
   digest: sha256:04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94
hostResolver:
  hosts:
    lima-labinf: 127.0.0.1
mounts: []
provision:
 - mode: system
   script: |
     #!/bin/bash
     set -euo pipefail
     apt-get update
     apt-get install -y kmod
     if apt-cache show "linux-modules-extra-$(uname -r)" >/dev/null 2>&1; then
       apt-get install -y "linux-modules-extra-$(uname -r)"
     fi
     for module in xfrm_user esp4 ah4 af_key nf_tables iptable_filter xt_conntrack xt_limit; do
       modprobe "$module"
     done
